<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timeline view - features</title>
    <script src="../dist/timelineview.js"></script>
    <link href="../dist/timelineview.css" rel="stylesheet">
    <link href="examples.css" rel="stylesheet">
</head>
<body>
    <h1>Features</h1>
    <p>
        Several timelines, a month scale, month and year durations, milestone symbols,
        names on the right, and callout labels at different heights above and below the bar.
    </p>
    <div id="timeline_here" style="height: 640px;"></div>
    <script>
        timeline.init("timeline_here");
        timeline.parse({
            view: {
                name: "Product plan", start_date: "2026-01-01", finish_date: "2027-07-01",
                scale: "month", name_position: "right", milestone_symbol: "diamond"
            },
            tasks: [
                { id: "design", text: "Design", start_date: "2026-01-15", duration: "3m" },
                { id: "build", text: "Build", start_date: "2026-04-01", duration: "8m" },
                { id: "beta", text: "Beta", start_date: "2026-09-01", symbol: "triangle" },
                { id: "launch", text: "Launch", start_date: "2026-12-01", symbol: "star" },
                { id: "support", text: "Support", start_date: "2026-12-01", duration: "1y" },
                { id: "review", text: "Design review", start_date: "2026-04-15", symbol: "circle" },
                { id: "audit", text: "Security audit", start_date: "2026-10-01", duration: "3w" },
                { id: "kickoff", text: "Kick-off", start_date: "2026-01-12", symbol: "square" }
            ],
            timelines: [
                { id: "dev", name: "Development", entries: [
                    { task: "design", placement: "on", line: 0 },
                    { task: "build", placement: "on", line: 1 },
                    { task: "kickoff", placement: "above", callout_offset: { x: 0, y: -16 } },
                    { task: "review", placement: "above", callout_offset: { x: -40, y: -64 } },
                    { task: "beta", placement: "below", callout_offset: { x: 12, y: 16 } }
                ]},
                { id: "ops", name: "Operations", entries: [
                    { task: "launch", placement: "on", line: 0 },
                    { task: "support", placement: "on", line: 1 },
                    { task: "audit", placement: "below", callout_offset: { x: -60, y: 40 } }
                ]}
            ]
        });
    </script>
</body>
</html>
