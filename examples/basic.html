<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timeline view - basic example</title>
    <script src="../dist/timelineview.js"></script>
    <link href="../dist/timelineview.css" rel="stylesheet">
    <link href="examples.css" rel="stylesheet">
</head>
<body>
    <h1>Basic timeline</h1>
    <p>Drag the task bar between lines, or drag the milestone label anywhere above or below the bar. The label areas grow to fit. Click a task or label to see the click event and select it; Ctrl+Click selects several. Untick "Selection" to turn selection off.</p>
    <p class="controls">
        <label><input type="checkbox" id="show_dates" checked> Show start and finish dates</label>
        <label><input type="checkbox" id="selection" checked> Selection</label>
        <label><input type="checkbox" id="click_events" checked> Report clicks:</label>
        <span id="clicked">Nothing clicked yet.</span>
    </p>
    <div id="timeline_here" style="width: 1000px; max-width: 100%;"></div>
    <script>
        timeline.init("timeline_here");
        // Re-parse the current data with the option changed.
        document.getElementById("show_dates").addEventListener("change", (e) => {
            const data = timeline.serialize();
            data.view.show_dates = e.target.checked;
            timeline.parse(data);
        });
        // Turns selection on or off (view.selection). Turning it off also clears the current selection.
        document.getElementById("selection").addEventListener("change", (e) => {
            const data = timeline.serialize();
            data.view.selection = e.target.checked;
            timeline.parse(data);
        });
        timeline.parse({
            view: { name: "Example", scale: "week" },
            tasks: [
                { id: 1, text: "Task #1", start_date: "2026-04-01", duration: "2d" },
                { id: 2, text: "Milestone #1", start_date: "2026-04-10" }
            ],
            timelines: [
                { id: 1, name: "Project", start_date: "2026-03-01", finish_date: "2026-05-01", entries: [
                    { task: 1, line: 0 },
                    { task: 2, callout_offset: { x: 30, y: 16 } }
                ]}
            ]
        });
        timeline.on("entry_moved", (e) => console.log("entry_moved", e));

        // Click events. Inside a `function` handler, `this` is the timeline view.
        // attachEvent returns an id; detachEvent(id) removes the handler again.
        const showClick = function (id, e) {
            const task = this.serialize().tasks.find((t) => t.id === id);
            document.getElementById("clicked").textContent = `You've just clicked "${task.text}" (id=${id}).`;
        };
        let clickEventId = timeline.attachEvent("onTaskClick", showClick);
        document.getElementById("click_events").addEventListener("change", (e) => {
            if (e.target.checked) {
                clickEventId = timeline.attachEvent("onTaskClick", showClick);
            } else {
                timeline.detachEvent(clickEventId);
                document.getElementById("clicked").textContent = "Clicks are not reported.";
            }
        });
    </script>
</body>
</html>
